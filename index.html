<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Point Latur CRM</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface-2:#F5FAF8; --ink:#12302A; --muted:#566F68; --line:#D5E4DF;
  --mint:#06D9A6; --emerald:#15C39A; --sage:#63A696;
  --teal:#0A7F62; --teal-hover:#086B52; --teal-soft:#DCF6EE; --teal-deep:#0F3D35; --on-teal:#FFFFFF;
  --rent:#594594; --rent-soft:#ECE7F7;
  --sell:#1D5FA6; --sell-soft:#E2EDF9;
  --ro:#A3366F; --ro-soft:#F8E4EE;
  --hot:#B5381F; --hot-soft:#FBE7E2; --warm:#9E5E06; --warm-soft:#FAEFDB; --cold:#3D6080; --cold-soft:#E4ECF4;
  --won:#1C6E44; --won-soft:#E0F1E6; --lost:#6B6B6B; --lost-soft:#EEEEEE;
  --mark:#06D9A6; --focus:#0A9C78; --scrim:rgba(8,30,30,.45);
  --shadow:0 1px 2px rgba(10,40,40,.06),0 6px 20px rgba(10,40,40,.07);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A17; --surface:#14241F; --surface-2:#192C26; --ink:#E3EFEB; --muted:#9BB4AC; --line:#28403A;
    --mint:#06D9A6; --emerald:#15C39A; --sage:#7DBBAB; --focus:#06D9A6;
    --teal:#2FD4A8; --teal-hover:#5BE0BD; --teal-soft:#133A31; --teal-deep:#0A2A23; --on-teal:#04221A;
    --rent:#B3A3E8; --rent-soft:#2A2442;
    --sell:#8DBBF0; --sell-soft:#1A2B40;
    --ro:#E89BC0; --ro-soft:#3A1F2D;
    --hot:#F08A72; --hot-soft:#3D221C; --warm:#E9B65C; --warm-soft:#3A2E17; --cold:#93B6D6; --cold-soft:#1D2C3A;
    --won:#7FD3A2; --won-soft:#173226; --lost:#AAAAAA; --lost-soft:#2A2A2A;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A17; --surface:#14241F; --surface-2:#192C26; --ink:#E3EFEB; --muted:#9BB4AC; --line:#28403A;
  --mint:#06D9A6; --emerald:#15C39A; --sage:#7DBBAB; --focus:#06D9A6;
  --teal:#2FD4A8; --teal-hover:#5BE0BD; --teal-soft:#133A31; --teal-deep:#0A2A23; --on-teal:#04221A;
  --rent:#B3A3E8; --rent-soft:#2A2442;
  --sell:#8DBBF0; --sell-soft:#1A2B40;
  --ro:#E89BC0; --ro-soft:#3A1F2D;
  --hot:#F08A72; --hot-soft:#3D221C; --warm:#E9B65C; --warm-soft:#3A2E17; --cold:#93B6D6; --cold-soft:#1D2C3A;
  --won:#7FD3A2; --won-soft:#173226; --lost:#AAAAAA; --lost-soft:#2A2A2A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);color:var(--ink);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.mark{display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:inherit;text-decoration:none}
.mark img{display:block;width:196px;height:auto}
.mark .crm{font-size:13px;font-weight:700;color:var(--sage);border:1.5px solid var(--sage);border-radius:6px;padding:0 7px;line-height:20px;letter-spacing:.04em;margin-left:2px}
.topbar .mark{flex-direction:row;align-items:center;gap:8px}
.topbar .mark img{width:132px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-weight:500;color:var(--muted);box-shadow:inset 0 0 0 0 var(--mint)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--teal-soft);color:var(--teal);font-weight:700;box-shadow:inset 4px 0 0 0 var(--mint)}
.nav .count{margin-left:auto;background:var(--mint);color:#03382A;font-size:12px;font-weight:700;border-radius:20px;padding:0 7px;line-height:20px}
.whoami{margin-top:auto;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.whoami label{display:block;color:var(--muted);margin-bottom:4px}
.whoami select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px}
.whoami .who{font-weight:600}
.topbar{display:none}
.tabbar{display:none}
main{min-width:0;padding:28px 32px 60px;max-width:1280px;width:100%}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warm-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warm) 35%,transparent);padding:10px 14px;border-radius:10px;margin-bottom:20px;font-size:15px}
.banner b{color:var(--warm)}
.banner .grow{flex:1;min-width:200px}

/* Type & atoms */
h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.015em}
h2{font-size:19px;margin:0 0 10px;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head .grow{flex:1;min-width:200px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-hover)}
.btn.big{padding:10px 18px;font-size:17px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--teal-soft)}
.btn.danger{color:var(--hot)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}
.btn.wa{color:#128C4A}
:root[data-theme="dark"] .btn.wa{color:#5FD392}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.wa{color:#5FD392}}
.badge{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:1px 8px;border-radius:6px;line-height:20px;white-space:nowrap}
.b-buy{background:var(--teal-soft);color:var(--teal)}
.b-rent{background:var(--rent-soft);color:var(--rent)}
.b-sell{background:var(--sell-soft);color:var(--sell)}
.b-ro{background:var(--ro-soft);color:var(--ro)}
.b-hot{background:var(--hot-soft);color:var(--hot)}
.b-warm{background:var(--warm-soft);color:var(--warm)}
.b-cold{background:var(--cold-soft);color:var(--cold)}
.stage{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.stage.won{background:var(--won-soft);color:var(--won);border-color:transparent}
.stage.lost{background:var(--lost-soft);color:var(--lost);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.due-over{color:var(--hot);font-weight:600}
.due-today{color:var(--warm);font-weight:600}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:26px}
.kpi{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--k,var(--teal))}
.kpi:hover{box-shadow:var(--shadow)}
.kpi:focus-visible{outline:3px solid var(--focus)}
.kpi .n{font-size:36px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:15px;line-height:1.25}
.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.pipe{display:flex;flex-direction:column;gap:8px}
.pipe-row{display:grid;grid-template-columns:170px 1fr 34px;gap:10px;align-items:center;font-size:15px}
.pipe-bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.pipe-bar i{display:block;height:100%;background:var(--emerald);border-radius:6px}
.pipe-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Leads list */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--teal)}
.tabs button .c{font-weight:500;color:var(--muted);margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input[type=search]{flex:1 1 240px;min-width:0}
.filters select{flex:0 1 170px}
.field-in,.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-height:40px;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);border-radius:20px;padding:2px 6px 2px 12px;font-size:14px;font-weight:600}
.chip button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.chip button:hover{background:rgba(0,0,0,.08)}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:14px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td .nm{font-weight:600;white-space:nowrap}
td.loc{min-width:120px}
td .sub{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cards{display:none;flex-direction:column;gap:10px}
.lcard{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lcard .r1{display:flex;gap:8px;align-items:center}
.lcard .r1 .nm{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .r2{color:var(--muted);font-size:14px;margin-top:2px}
.lcard .r3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--ink)}
.fab{display:none}

/* Detail */
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.back:hover{color:var(--ink)}
.lead-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.lead-head .grow{flex:1;min-width:240px}
.lead-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 20px}
.track button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.2;color:var(--muted);padding-top:2px}
.track button::before{content:"";height:8px;border-radius:4px;background:var(--line)}
.track button.done::before{background:var(--mint);opacity:.55}
.track button.cur{color:var(--ink);font-weight:700}
.track button.cur::before{background:var(--teal);height:8px}
.track button:hover{color:var(--ink)}
.track.lost button.cur::before{background:var(--hot)}
.track.won button::before{background:var(--won)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
dl.facts{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0;font-size:15px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.next{border-left:4px solid var(--mark)}
.next .when{font-size:20px;font-weight:700}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel-head h2{margin:0;flex:1}
.visit{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.visit:first-of-type{border-top:0}
.visit .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 22px}
.tl li::before{content:"";position:absolute;left:5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--teal)}
.tl li::after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.k-stage::before{background:var(--sage)}
.tl li.k-lost::before{background:var(--hot)}
.tl .t{font-size:13px;color:var(--muted)}
.tl .x{white-space:pre-wrap;overflow-wrap:anywhere}
.note-box{display:flex;gap:8px;margin-bottom:16px}
.note-box textarea{flex:1;min-height:44px;resize:vertical}
.mobile-actions{display:none}

/* Follow-ups */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:18px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.group{margin-bottom:24px}
.group h2 .c{color:var(--muted);font-weight:500}
.fu{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.fu .time{width:120px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.fu .who{flex:1;min-width:180px}
.fu .who b{cursor:pointer}
.fu .who b:hover{text-decoration:underline}
.fu .acts{display:flex;gap:6px;flex-wrap:wrap}

/* Forms & modal */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.scrim{position:fixed;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:520px;padding:22px;animation:pop .16s ease-out}
.sheet.wide{max-width:760px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-head h2{margin:0;flex:1;font-size:22px}
.x-btn{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.x-btn:hover{background:var(--surface-2);color:var(--ink)}
.form{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:14px;font-weight:600}
.f > span em{font-style:normal;color:var(--hot)}
.f small{color:var(--muted);font-size:13px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-height:42px;width:100%}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.filters input:focus,.filters select:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
.phone{display:grid;grid-template-columns:78px 1fr;gap:6px}
.typepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.typepick{grid-template-columns:1fr 1fr}}
.typepick label{cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.typepick label b{font-size:18px}
.typepick label span{color:var(--muted);font-size:14px}
.typepick input{position:absolute;opacity:0}
.typepick label:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.typepick label.rentpick:has(input:checked){border-color:var(--rent);background:var(--rent-soft)}
.typepick label.sellpick:has(input:checked){border-color:var(--sell);background:var(--sell-soft)}
.typepick label.ropick:has(input:checked){border-color:var(--ro);background:var(--ro-soft)}
.typepick label:has(input:focus-visible){outline:3px solid var(--focus)}
.locs{display:flex;flex-wrap:wrap;gap:6px}
.locs label{cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.locs label:has(input:checked){background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.locs input{position:absolute;opacity:0}
.locs label:has(input:focus-visible){outline:3px solid var(--focus)}
.loc-add{display:flex;gap:6px;margin-top:6px}
.loc-add input{flex:1}
fieldset{border:0;padding:0;margin:0;min-width:0}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--teal);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
details.more .form{margin-top:14px}
.sect{font-weight:700;font-size:15px;color:var(--muted);margin:4px 0 -4px}
form[data-type="buy"] .rent-only,form[data-type="rent"] .buy-only{display:none}
form:not([data-type="sell"]) .sell-only,form:not([data-type="rentout"]) .ro-only,form:not([data-type="sell"]):not([data-type="rentout"]) .owner-only,form[data-type="sell"] .buy-only,form[data-type="sell"] .rent-only,form[data-type="sell"] .not-owner,form[data-type="rentout"] .buy-only,form[data-type="rentout"] .rent-only,form[data-type="rentout"] .not-owner{display:none}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dup{background:var(--warm-soft);border:1px solid color-mix(in srgb,var(--warm) 40%,transparent);border-radius:10px;padding:12px 14px}
.dup ul{margin:6px 0 10px;padding-left:18px}
.err{color:var(--hot);font-size:14px;font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--teal)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.bare .app{grid-template-columns:1fr}
.bare .side,.bare .topbar,.bare .tabbar{display:none!important}
.gate{max-width:440px;margin:6vh auto 40px;display:flex;flex-direction:column;gap:14px;padding:28px}
.gate-logo{width:250px;height:auto;margin-bottom:6px}
.gate h1{font-size:26px}
.gate p{margin:0}
.gate .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px}
.gate .links button{all:unset;cursor:pointer;color:var(--teal);font-weight:600}
.gate .links button:hover{text-decoration:underline}
.ok{color:var(--won);font-weight:600;font-size:15px}
.tm-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tm-actions select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;min-height:32px}
.pend{background:var(--warm-soft);color:var(--warm)}

/* Responsive */
@media (max-width:1380px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.dash-grid,.detail-grid{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--ink);padding:8px 14px;border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 0 var(--mint)}
  .topbar .spacer{flex:1}
  .topbar select{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 6px;font-size:14px;max-width:150px}
  .topbar .who{font-size:14px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  main{padding:18px 14px 110px}
  h1{font-size:26px}
  .tabbar{display:grid;grid-template-columns:repeat(var(--tabs,3),1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px;font-size:13px;font-weight:600;color:var(--muted);position:relative}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--teal)}
  .tabbar .count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--mint);color:#03382A;font-size:11px;font-weight:700;border-radius:10px;padding:0 5px;line-height:16px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .n{font-size:30px}
  .table-wrap{display:none}
  .cards{display:flex}
  .page-head .btn.add-desk{display:none}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:var(--shadow);border-radius:28px;padding:12px 20px}
  .filters select{flex:1 1 45%}
  .actions.desk{display:none}
  .mobile-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:24;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px}
  .mobile-actions .btn{flex-direction:column;gap:2px;font-size:12.5px;padding:6px 2px;min-height:52px}
  main.has-mact{padding-bottom:190px}
  .track{grid-template-columns:repeat(4,1fr);row-gap:12px}
  dl.facts{grid-template-columns:120px 1fr}
  #modal{padding:0;align-items:stretch}
  .sheet{border-radius:0;min-height:100%;max-width:none;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .sheet-foot{position:sticky;bottom:0;background:var(--surface);padding:10px 0;margin-bottom:-10px}
  .sheet-foot .btn{flex:1}
  .row3{grid-template-columns:1fr 1fr}
  .fu .time{width:auto}
  .pipe-row{grid-template-columns:130px 1fr 28px;font-size:14px}
}
@media (max-width:420px){.row{grid-template-columns:1fr}.row.keep{grid-template-columns:1fr 1fr}}
</style>

<script>
"use strict";
document.querySelector('.logo-m').src=document.querySelector('.side .mark img').src;
/* ---------- Constants ---------- */
const STAGES=['New','Contacted','Requirement Confirmed','Options Shared','Site Visit Scheduled','Negotiation','Closed Won','Closed Lost'];
const PTYPES=['Flat','Independent House','Bungalow','Plot','Shop','Office','Other'];
const BHK_TYPES=['Flat','Independent House','Bungalow'];
const BHKS=['1 RK','1 BHK','2 BHK','3 BHK','4 BHK','5+ BHK'];
const BASE_LOCS=['Ausa Road','Old Ausa Road','Barshi Road','Ambajogai Road'];
const SOURCES=['Phone Call','WhatsApp','Website','Google Business Profile','Instagram','Facebook','Referral','Walk-in','Other'];
const PRIORITIES=['Hot','Warm','Cold'];
const FINANCE=['Cash','Home loan','Not decided'];
const TENANT_PREF=['Family','Bachelors','Working professionals','Company lease','Any'];
const NEGOTIABLE=['Yes','Slightly','No (fixed price)'];
const TIMELINES=['Immediately','Within 1 month','1–3 months','3–6 months','6+ months','Not decided'];
const FURNISH=['Unfurnished','Semi-furnished','Fully furnished','Any'];
const OUTCOMES=['Connected','Interested','Call back later','No answer','Busy / switched off','Not interested','Wrong number'];
const LOST_REASONS=['Budget mismatch','Bought or rented elsewhere','Stopped responding','Requirement changed','Plan postponed','Didn’t like the options','Other'];
const TZ='Asia/Kolkata', IST=330*60000, DAY=86400000;
const isOpen=l=>l.stage!=='Closed Won'&&l.stage!=='Closed Lost';

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const inr=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
function fmtINR(n){return (n==null||n===''||isNaN(n))?'':inr.format(n)}
function parseMoney(s){
  if(s==null) return null;
  s=String(s).toLowerCase().replace(/[,₹\s]|rs\.?|inr/g,'');
  if(!s) return null;
  const m=s.match(/^(\d+(?:\.\d+)?)(cr|crore|crores|l|lac|lacs|lakh|lakhs|k|thousand)?$/);
  if(!m) return NaN;
  let n=parseFloat(m[1]); const u=m[2]||'';
  if(u.startsWith('c')) n*=1e7; else if(u.startsWith('l')) n*=1e5; else if(u==='k'||u==='thousand') n*=1e3;
  return Math.round(n);
}
function rangeText(min,max,suffix=''){
  const a=fmtINR(min), b=fmtINR(max);
  if(a&&b) return a===b? a+suffix : `${a} – ${b}${suffix}`;
  if(b) return `Up to ${b}${suffix}`;
  if(a) return `From ${a}${suffix}`;
  return '';
}
function budgetText(l){return l.type==='rentout'?(fmtINR(l.expectedRent)?'Expects '+fmtINR(l.expectedRent)+'/month':''):l.type==='buy'?rangeText(l.budgetMin,l.budgetMax):l.type==='sell'?(fmtINR(l.askingPrice)?'Asking '+fmtINR(l.askingPrice):''):rangeText(l.rentMin,l.rentMax,'/month')}
function typeLabel(t){return t==='buy'?'Buy':t==='sell'?'Sell':t==='rentout'?'Rent out':'Rent'}
function normPhone(cc,num){
  let raw=String(num||'').trim(); if(!raw) return '';
  let c=String(cc||'+91').replace(/\D/g,'')||'91';
  if(raw.startsWith('+')){ return '+'+raw.replace(/\D/g,''); }
  let d=raw.replace(/\D/g,'');
  if(c==='91'){ if(d.length===12&&d.startsWith('91')) d=d.slice(2); if(d.length===11&&d.startsWith('0')) d=d.slice(1); }
  return d?'+'+c+d:'';
}
function validPhone(p){ if(!p) return false; if(p.startsWith('+91')) return /^\+91[6-9]\d{9}$/.test(p); return /^\+\d{8,15}$/.test(p); }
function fmtPhone(p){ if(!p) return ''; const m=p.match(/^\+91(\d{5})(\d{5})$/); return m?`+91 ${m[1]} ${m[2]}`:p; }
function waDigits(p){return String(p||'').replace(/\D/g,'')}
function inputToISO(v){ if(!v) return null; const t=Date.parse(v+':00+05:30'); return isNaN(t)?null:new Date(t).toISOString(); }
function isoToInput(iso){ if(!iso) return ''; return new Date(Date.parse(iso)+IST).toISOString().slice(0,16); }
function dayKey(ms){ return new Date(ms+IST).toISOString().slice(0,10); }
const fTime=new Intl.DateTimeFormat('en-IN',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true});
const fDate=new Intl.DateTimeFormat('en-IN',{timeZone:TZ,day:'numeric',month:'short'});
const fDateY=new Intl.DateTimeFormat('en-IN',{timeZone:TZ,day:'numeric',month:'short',year:'numeric'});
const fWk=new Intl.DateTimeFormat('en-IN',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'});
function whenText(iso,{short}={}){
  if(!iso) return '';
  const t=Date.parse(iso), now=Date.now(), k=dayKey(t), today=dayKey(now);
  const time=fTime.format(t).replace(' am',' am').replace(' pm',' pm');
  if(k===today) return `Today, ${time}`;
  if(k===dayKey(now+DAY)) return `Tomorrow, ${time}`;
  if(k===dayKey(now-DAY)) return `Yesterday, ${time}`;
  const sameYear=k.slice(0,4)===today.slice(0,4);
  return `${(sameYear?(short?fDate:fWk):fDateY).format(t)}, ${time}`;
}
function dueClass(iso){ if(!iso) return ''; const t=Date.parse(iso); if(t<Date.now()) return 'due-over'; if(dayKey(t)===dayKey(Date.now())) return 'due-today'; return ''; }
function dateOnly(v){ if(!v) return ''; const t=Date.parse(v+'T00:00:00+05:30'); return isNaN(t)?v:fDateY.format(t); }
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||''}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---------- Derived ---------- */
function filtered(){
  let a=allLeads();
  if(S.tab!=='all') a=a.filter(l=>l.type===S.tab);
  const q=S.q.trim().toLowerCase(), qd=q.replace(/\D/g,'');
  if(q) a=a.filter(l=>String(l.name||'').toLowerCase().includes(q)||(qd.length>=3&&(waDigits(l.phone).includes(qd)||waDigits(l.whatsapp).includes(qd))));
  if(S.fStage) a=a.filter(l=>S.fStage==='__open'?isOpen(l):l.stage===S.fStage);
  if(S.fLoc) a=a.filter(l=>(l.localities||[]).includes(S.fLoc));
  if(S.fSource) a=a.filter(l=>l.source===S.fSource);
  if(S.fAgent) a=a.filter(l=>l.assignedTo===S.fAgent);
  return a.sort((x,y)=>String(y.updatedAt).localeCompare(String(x.updatedAt)));
}
function followUps(){
  const now=Date.now(), today=dayKey(now), o=[],t=[],u=[];
  for(const l of allLeads()){ if(!l.nextFollowUp||!isOpen(l)) continue; const ts=Date.parse(l.nextFollowUp);
    if(ts<now) o.push(l); else if(dayKey(ts)===today) t.push(l); else u.push(l); }
  const s=(a,b)=>Date.parse(a.nextFollowUp)-Date.parse(b.nextFollowUp);
  return {overdue:o.sort(s),today:t.sort(s),upcoming:u.sort(s)};
}
function upcomingVisits(){
  const now=Date.now(), out=[];
  for(const l of allLeads()) for(const v of (l.visits||[])) if(v.status==='scheduled'&&Date.parse(v.at)>=now-2*3600000) out.push({l,v});
  return out.sort((a,b)=>Date.parse(a.v.at)-Date.parse(b.v.at));
}

  </div>`;
}

function actLabel(a){

}

async function authSubmit(f){
  const fd=new FormData(f), k=f.dataset.kind, err=$('#auth-err'), msg=$('#auth-msg'), btn=f.querySelector('[type=submit]');
  err.textContent=''; msg.textContent='';
  const sb=Live.sb, email=String(fd.get('email')||'').trim(), pw=String(fd.get('password')||''), redirect=location.origin+location.pathname;
  if(k!=='recover'&&!/^\S+@\S+\.\S+$/.test(email)){ err.textContent='Enter a valid email address.'; return; }
  if((k==='signup'||k==='recover')&&pw.length<8){ err.textContent='Use a password of at least 8 characters.'; return; }
  if(k==='signup'&&!String(fd.get('name')||'').trim()){ err.textContent='Enter your name.'; return; }
  if(k==='signin'&&!pw){ err.textContent='Enter your password.'; return; }
  btn.disabled=true;
  try{

function applyStage(l,stage,reason){
  if(!stage||stage===l.stage) return;
  const prev=l.stage; l.stage=stage;
  if(stage==='Closed Lost'){ l.lostReason=reason||'Other'; addAct(l,'stage',`Stage changed to Closed Lost — ${l.lostReason}`); }
  else { addAct(l,'stage',`Stage changed from ${prev} to ${stage}`); if(prev==='Closed Lost') delete l.lostReason; }

function wireLeadForm(m,orig){

async function submitLead(form,orig,force){
  const fd=new FormData(form), err=form.querySelector('#form-err'); err.textContent='';
  const type=fd.get('type'), name=String(fd.get('name')||'').trim();
  const phone=normPhone(fd.get('cc'),fd.get('phone'));
  const problems=[];
  if(!type) problems.push('choose Buy, Rent, Sell or Rent out');
  if(!name) problems.push('enter the client’s name');
  if(!validPhone(phone)) problems.push('enter a valid mobile number (10 digits for India)');
  let wa=phone; if(!fd.get('sameWa')){ const w=String(fd.get('whatsapp')||'').trim(); if(w){ wa=normPhone('+91',w); if(!validPhone(wa)) problems.push('check the WhatsApp number'); } }
  const money={}; for(const k of ['budgetMin','budgetMax','rentMin','rentMax','deposit','askingPrice','expectedRent','roDeposit']){ const v=parseMoney(fd.get(k)); if(Number.isNaN(v)) problems.push(`check the ${k.startsWith('budget')?'budget':k.startsWith('rent')?'rent':k==='askingPrice'?'expected price':k==='expectedRent'?'expected rent':'deposit'} amount`); money[k]=Number.isNaN(v)?null:v; }
  if(type==='buy'&&money.budgetMin&&money.budgetMax&&money.budgetMin>money.budgetMax) problems.push('budget “from” is higher than “up to”');
  if(type==='rent'&&money.rentMin&&money.rentMax&&money.rentMin>money.rentMax) problems.push('rent “from” is higher than “up to”');
  if(problems.length){ err.textContent='To save, '+problems.join('; ')+'.'; err.scrollIntoView({block:'nearest'}); return; }
  if(!orig&&!force){
    const phones=[...new Set([phone,wa].filter(Boolean))];
    const d=S.mode==='live'?await Live.findDups(phones)
      :allLeads().filter(x=>phones.includes(x.phone)||phones.includes(x.whatsapp)).map(x=>({name:x.name,type:x.type,stage:x.stage,agent:agentName(x.assignedTo),prop:propText(x),key:keyOf(x)}));
    if(d.length){
      form.querySelector('#dup-slot').innerHTML=`<div class="dup" role="alert"><b>Possible duplicate.</b> This number is already on ${d.length===1?'a lead':d.length+' leads'}:
        <ul>${d.map(x=>`<li>${esc(x.name)} · ${typeLabel(x.type)} · ${esc(x.stage)}${x.prop?' · '+esc(x.prop):''}${x.key?'':` · with ${esc(x.agent||'another agent')}`}</li>`).join('')}</ul>
        <div class="actions">${d.filter(x=>x.key).slice(0,2).map(x=>`<button type="button" class="btn sm" data-act="dup-open" data-key="${esc(x.key)}">Open ${esc(firstName(x.name))}’s lead</button>`).join('')}<button type="button" class="btn sm primary" data-act="dup-continue">Save as separate requirement</button></div></div>`;
      form.querySelector('#dup-slot').scrollIntoView({block:'nearest'});
      return;
    }
  }
  const l=orig?clone(orig):{id:uid(),createdAt:nowISO(),stage:'New',activities:[],visits:[],createdBy:S.me.id};
  const assignedTo=isAdmin()?(fd.get('assignedTo')||S.me.id):(orig?orig.assignedTo:S.me.id);
  Object.assign(l,{type,name,phone,whatsapp:wa,email:String(fd.get('email')||'').trim(),propertyType:fd.get('propertyType')||'',bhk:BHK_TYPES.includes(fd.get('propertyType'))||!fd.get('propertyType')?(fd.get('bhk')||''):'',
    localities:fd.getAll('loc'),source:fd.get('source')||'',priority:fd.get('priority')||'',listingUrl:String(fd.get('listingUrl')||'').trim(),notes:String(fd.get('notes')||'').trim()});
  const TYPE_KEYS=['budgetMin','budgetMax','finance','timeline','rentMin','rentMax','deposit','moveIn','furnishing','askingPrice','negotiable','area','address','documents','expectedRent','availableFrom','preferredTenant'];
  const txtf=k=>String(fd.get(k)||'').trim();
  const vals=type==='buy'?{budgetMin:money.budgetMin,budgetMax:money.budgetMax,finance:fd.get('finance')||'',timeline:fd.get('timeline')||''}
    :type==='sell'?{askingPrice:money.askingPrice,negotiable:fd.get('negotiable')||'',area:txtf('area'),address:txtf('address'),documents:fd.get('documents')||'',timeline:fd.get('sellTimeline')||''}
    :type==='rentout'?{expectedRent:money.expectedRent,deposit:money.roDeposit,furnishing:fd.get('roFurnishing')||'',availableFrom:fd.get('availableFrom')||'',preferredTenant:fd.get('preferredTenant')||'',area:txtf('area'),address:txtf('address')}
    :{rentMin:money.rentMin,rentMax:money.rentMax,deposit:money.deposit,moveIn:fd.get('moveIn')||'',furnishing:fd.get('furnishing')||''};
  for(const k of TYPE_KEYS) if(!(k in vals)) delete l[k];
  Object.assign(l,vals);
  if(type==='sell'||type==='rentout') l.listingUrl='';
  if(!orig){
    l.assignedTo=assignedTo;
    addAct(l,'created',`Lead added${l.source?' from '+l.source:''}${force?' (same number as an existing lead, separate requirement)':''}`);
    const nf=inputToISO(fd.get('nextFollowUp')); if(nf){ l.nextFollowUp=nf; l.followUpNote='First follow-up'; addAct(l,'followup_set',`Follow-up scheduled for ${whenText(nf)}`); }
    if(assignedTo!==S.me.id) addAct(l,'assigned',`Assigned to ${agentName(assignedTo)}`);
    closeModal(); const ok=await persist(l); if(ok){ toast('Lead saved'); go('lead',{leadKey:keyOf(l)}); }
  } else {
    addAct(l,'edited','Lead details updated');
    closeModal();
    if(isAdmin()&&assignedTo!==orig.assignedTo){ addAct(l,'assigned',`Reassigned to ${agentName(assignedTo)}`); await store().move(l,assignedTo); S.leadKey=keyOf(l); render(); toast('Lead saved and reassigned'); }
    else { l.assignedTo=orig.assignedTo; await persist(l); toast('Changes saved'); }
  }
}

    <label class="f"><span>What to follow up on</span><input name="note" value="${esc(l.followUpNote||'')}" placeholder="e.g. Share 3 options on Ausa Road"></label>
    ${foot('Schedule follow-up')}</form>`,{onSubmit:async f=>{ const fd=new FormData(f); const at=inputToISO(fd.get('at')); if(!at) return;
      const c=clone(l); const was=!!c.nextFollowUp; c.nextFollowUp=at; c.followUpNote=String(fd.get('note')||'').trim();
      addAct(c,'followup_set',`Follow-up ${was?'rescheduled':'scheduled'} for ${whenText(at)}${c.followUpNote?' — '+c.followUpNote:''}`);
      closeModal(); await persist(c); toast('Follow-up scheduled'); }});
}
function mVisit(l){
  openModal(`${head('Schedule site visit')}<form class="form"><p class="muted" style="margin:0">${esc(l.name)} · ${esc(fmtPhone(l.phone))}</p>
    ${dt('at','Date and time (IST)',defaultSlot(),true)}
    <label class="f"><span>Property address <em>*</em></span><input name="address" required placeholder="e.g. Flat 302, Sai Residency, Ausa Road"></label>
    <label class="f"><span>Listing link</span><input name="link" type="url" inputmode="url" value="${esc(l.listingUrl||'')}" placeholder="https://"></label>
    <label class="f"><span>Note</span><input name="note" placeholder="e.g. Meet at the building gate"></label>
    ${foot('Schedule site visit')}</form>`,{onSubmit:async f=>{ const fd=new FormData(f); const at=inputToISO(fd.get('at')); const address=String(fd.get('address')||'').trim(); if(!at||!address){ f.reportValidity(); return; }
      const c=clone(l); c.visits=c.visits||[]; const v={id:uid(),at,address,link:String(fd.get('link')||'').trim(),note:String(fd.get('note')||'').trim(),status:'scheduled'}; c.visits.push(v);
      addAct(c,'visit_set',`Site visit scheduled for ${whenText(at)} at ${address}`);
      if(isOpen(c)&&STAGES.indexOf(c.stage)<STAGES.indexOf('Site Visit Scheduled')) applyStage(c,'Site Visit Scheduled');
      closeModal(); await persist(c); toast('Site visit scheduled'); }});
}
function mVisitDone(l,vid){
  const v=(l.visits||[]).find(x=>x.id===vid); if(!v) return;
  openModal(`${head('Record site visit')}<form class="form"><p class="muted" style="margin:0">${esc(l.name)} · ${esc(whenText(v.at))}<br>${esc(v.address)}</p>
    <label class="f"><span>How did it go?</span><select name="outcome">${opts(['Liked it','Interested, wants to negotiate','Wants more options','Not interested','Client didn’t come'],'Liked it')}</select></label>
    <label class="f"><span>Notes</span><textarea name="note" placeholder="Client feedback"></textarea></label>
    ${stageField(l.stage)}
    ${dt('next','Next follow-up',defaultSlot())}
    ${foot('Save visit')}</form>`,{onMount:wireStage,onSubmit:async f=>{ const fd=new FormData(f); const c=clone(l); const vv=c.visits.find(x=>x.id===vid);
      vv.status='done'; vv.outcome=fd.get('outcome'); vv.note=[vv.note,String(fd.get('note')||'').trim()].filter(Boolean).join(' — ');
      addAct(c,'visit_done',String(fd.get('note')||'').trim()||vv.address,{outcome:vv.outcome});
      applyStage(c,fd.get('stage'),fd.get('lostReason'));
      const nx=inputToISO(fd.get('next')); if(nx&&isOpen(c)){ c.nextFollowUp=nx; c.followUpNote=c.followUpNote||'After site visit'; addAct(c,'followup_set',`Follow-up scheduled for ${whenText(nx)}`); }
      closeModal(); await persist(c); toast('Site visit recorded'); }});
}
async function visitCancel(l,vid){ if(!confirm('Cancel this site visit?')) return; const c=clone(l); const v=c.visits.find(x=>x.id===vid); v.status='cancelled'; addAct(c,'visit_cancel',`Site visit on ${whenText(v.at)} cancelled`); await persist(c); toast('Site visit cancelled'); }
function mCall(l,{fu}={}){
  openModal(`${head(fu?'Complete follow-up':'Log call')}<form class="form"><p class="muted" style="margin:0">${esc(l.name)} · <a href="tel:${esc(l.phone)}">${esc(fmtPhone(l.phone))}</a>${fu&&l.followUpNote?`<br>Planned: ${esc(l.followUpNote)}`:''}</p>
    <label class="f"><span>Outcome</span><select name="outcome">${opts(OUTCOMES,'Connected')}</select></label>
    <label class="f"><span>Notes</span><textarea name="note" placeholder="What did the client say? (English or मराठी)"></textarea></label>
    ${stageField(l.stage)}
    ${dt('next','Next follow-up',defaultSlot())}
    <label class="f"><span>Next follow-up about</span><input name="nextNote" placeholder="e.g. Send floor plan"></label>
    ${foot(fu?'Mark done':'Save call')}</form>`,{onMount:wireStage,onSubmit:async f=>{ const fd=new FormData(f); const c=clone(l);
      addAct(c,fu?'followup_done':'call',String(fd.get('note')||'').trim(),{outcome:fd.get('outcome')});
      if(fu||c.nextFollowUp){ /* completing clears old */ }
      if(fu){ c.nextFollowUp=null; c.followUpNote=''; }
      applyStage(c,fd.get('stage'),fd.get('lostReason'));
      const nx=inputToISO(fd.get('next')); if(nx&&isOpen(c)){ c.nextFollowUp=nx; c.followUpNote=String(fd.get('nextNote')||'').trim(); addAct(c,'followup_set',`Follow-up scheduled for ${whenText(nx)}${c.followUpNote?' — '+c.followUpNote:''}`); }
      closeModal(); await persist(c); toast(fu?'Follow-up marked done':'Call saved'); }});
}
function mStage(l,stage){
  const closing=stage==='__close';
  openModal(`${head(closing?'Close this lead':'Change stage')}<form class="form"><p class="muted" style="margin:0">${esc(l.name)} · now ${esc(l.stage)}</p>
    ${closing?`<div class="typepick"><label><input type="radio" name="stage" value="Closed Won" checked data-act="close-pick"><b>Won</b><span>Deal done</span></label><label class="rentpick"><input type="radio" name="stage" value="Closed Lost" data-act="close-pick"><b>Lost</b><span>Client dropped</span></label></div>
      <label class="f lost-f" hidden><span>Reason lost <em>*</em></span><select name="lostReason">${opts(LOST_REASONS,'','Choose a reason')}</select></label>`
    :`<input type="hidden" name="stage" value="${esc(stage)}"><p style="margin:0">Move to <b>${esc(stage)}</b>?</p>`}
    <label class="f"><span>Note</span><input name="note" placeholder="Optional"></label>
    ${foot(closing?'Close lead':'Change stage')}</form>`,{onMount:m=>{ if(!closing) return; const lf=m.querySelector('.lost-f'); m.querySelectorAll('[data-act=close-pick]').forEach(r=>r.addEventListener('change',()=>{ const on=m.querySelector('[name=stage]:checked').value==='Closed Lost'; lf.hidden=!on; lf.querySelector('select').required=on; })); },
    onSubmit:async f=>{ const fd=new FormData(f); const st=fd.get('stage'); if(st==='Closed Lost'&&!fd.get('lostReason')){ f.reportValidity(); return; }
      const c=clone(l); applyStage(c,st,fd.get('lostReason')); const n=String(fd.get('note')||'').trim(); if(n) addAct(c,'note',n);
      closeModal(); await persist(c); toast(`Stage: ${st}`); }});
}
function waDraft(l){
  const me=S.mode==='demo'?agentName(S.me.id).replace(/ \(.*\)/,''):(S.me.name||'');
  const who=me&&me!=='Admin'?`${me} from Property Point Latur`:'Property Point Latur';
  const prop=[l.bhk,l.propertyType].filter(Boolean).join(' ')||'property';
  const loc=(l.localities||[]).length?` on ${l.localities.join(' / ')}`:'';
  if(l.type==='rentout') return `Namaskar ${firstName(l.name)}, this is ${who}. Thank you for choosing us to find a tenant for your ${prop}${loc}. I’d like to visit and take a few photos so we can start showing it. When is a good time to talk?`;
  if(l.type==='sell') return `Namaskar ${firstName(l.name)}, this is ${who}. Thank you for choosing us to sell your ${prop}${loc}. I’d like to visit and take a few photos so we can start showing it to buyers. When is a good time to talk?`;
  return l.type==='rent'
    ?`Namaskar ${firstName(l.name)}, this is ${who}. Thank you for your enquiry for a ${prop} on rent${loc}${l.rentMax?`, around ${fmtINR(l.rentMax)}/month`:''}. I’ll share a few options that match. When is a good time to talk?`
    :`Namaskar ${firstName(l.name)}, this is ${who}. Thank you for your enquiry for a ${prop}${loc}${l.budgetMax?` within ${fmtINR(l.budgetMax)}`:''}. I’ll share a few options that match. When is a good time to talk?`;
}
function mWA(l){
  const num=waDigits(l.whatsapp||l.phone);
  openModal(`${head('WhatsApp message')}<form class="form"><p class="muted" style="margin:0">To ${esc(l.name)} · ${esc(fmtPhone(l.whatsapp||l.phone))}</p>
    <label class="f"><span>Message (edit before sending)</span><textarea name="msg" id="wa-msg" rows="6">${esc(waDraft(l))}</textarea></label>
    <label class="check"><input type="checkbox" name="log" checked> Add this message to the activity log</label>
    <div class="sheet-foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><a class="btn primary" id="wa-go" target="_blank" rel="noopener" href="#">${ICON.wa}Open WhatsApp</a></div></form>`,
  {onMount:m=>{ const ta=m.querySelector('#wa-msg'), a=m.querySelector('#wa-go'); const upd=()=>{ a.href=`https://wa.me/${num}?text=${encodeURIComponent(ta.value)}`; }; ta.addEventListener('input',upd); upd();
    a.addEventListener('click',async()=>{ const log=m.querySelector('[name=log]').checked; const txt=ta.value.trim(); closeModal(); if(log&&S.me.canWrite&&txt){ const c=clone(l); addAct(c,'note',`WhatsApp opened with message:\n${txt}`); await persist(c);} }); }});
}
function mReassign(l){
  openModal(`${head('Reassign lead')}<form class="form"><p class="muted" style="margin:0">${esc(l.name)} · now with ${esc(agentName(l.assignedTo))}</p>
    <label class="f"><span>Assign to</span><select name="to">${assignable().map(a=>`<option value="${esc(a.id)}"${a.id===l.assignedTo?' selected':''}>${esc(a.name)}</option>`).join('')}</select></label>${foot('Reassign')}</form>`,
  {onSubmit:async f=>{ const to=new FormData(f).get('to'); if(to===l.assignedTo){ closeModal(); return; } const c=clone(l); addAct(c,'assigned',`Reassigned from ${agentName(l.assignedTo)} to ${agentName(to)}`); closeModal(); await store().move(c,to); S.leadKey=keyOf(c); render(); toast(`Assigned to ${agentName(to)}`); }});
}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, k=t.dataset.key, l=k?get(k):null;
  switch(a){
    case 'nav': e.preventDefault(); if(t.dataset.view==='leads') Object.assign(S,{}); go(t.dataset.view); break;
    case 'back': go('leads'); break;
    case 'tab': S.tab=t.dataset.tab; render(); break;
    case 'clear-filters': Object.assign(S,{q:'',fStage:'',fLoc:'',fSource:'',fAgent:''}); render(); break;
    case 'open': go('lead',{leadKey:k}); break;
    case 'add': openModal(leadForm(null),{wide:true,onMount:m=>wireLeadForm(m,null)}); break;
    case 'edit': if(l) openModal(leadForm(l),{wide:true,onMount:m=>wireLeadForm(m,l)}); break;
    case 'close-modal': closeModal(); break;
    case 'dup-open': closeModal(); go('lead',{leadKey:k}); break;
    case 'dup-continue': submitLead($('#leadform'),null,true); break;
    case 'wa': if(l) mWA(l); break;
    case 'sched-fu': if(l) mFollow(l); break;
    case 'sched-visit': if(l) mVisit(l); break;
    case 'log-call': if(l) mCall(l); break;
    case 'fu-done': if(l) mCall(l,{fu:true}); break;
    case 'visit-done': if(l) mVisitDone(l,t.dataset.vid); break;
    case 'visit-cancel': if(l) visitCancel(l,t.dataset.vid); break;
    case 'stage': if(l&&t.dataset.stage!==l.stage) mStage(l,t.dataset.stage); break;
    case 'reassign': if(l) mReassign(l); break;
    case 'delete': if(l&&confirm(`Delete ${l.name}’s lead and its history? This can’t be undone.`)){ await store().remove(l); go('leads'); toast('Lead deleted'); } break;
    case 'fu-filter': S.fuFilter=t.dataset.f; render(); break;
    case 'team-leads': go('leads',{tab:'all',fAgent:t.dataset.id,q:'',fStage:'',fLoc:'',fSource:''}); break;
    case 'dash-buy': go('leads',{tab:'buy',fStage:'__open',q:'',fLoc:'',fSource:'',fAgent:''}); break;
    case 'dash-rent': go('leads',{tab:'rent',fStage:'__open',q:'',fLoc:'',fSource:'',fAgent:''}); break;
    case 'dash-sell': go('leads',{tab:'sell',fStage:'__open',q:'',fLoc:'',fSource:'',fAgent:''}); break;
    case 'dash-rentout': go('leads',{tab:'rentout',fStage:'__open',q:'',fLoc:'',fSource:'',fAgent:''}); break;
    case 'dash-today': go('followups',{fuFilter:'today'}); break;
    case 'dash-over': go('followups',{fuFilter:'overdue'}); break;
    case 'dash-visits': go('followups',{fuFilter:'visits'}); break;
    case 'demo-reset': if(confirm('Reset the demo to the original fictional leads?')){ Demo.reset(); go('dashboard'); toast('Demo data reset'); } break;
    case 'sample': await addSamples(); break;
    case 'signout': if(Live.sb){ await Live.sb.auth.signOut(); } S.view='dashboard'; break;
    case 'recheck': { const {data}=await Live.sb.auth.getSession(); Live.enter(data.session,true); break; }
    case 'auth-kind': S.authKind=t.dataset.k; render(); break;
    case 'demo-start': Demo.start(); S.view='dashboard'; render(); break;
    case 'team-active': { const v=t.dataset.v==='1'; const p=S.team.find(x=>x.id===t.dataset.id);
      if(!v&&!confirm(`Remove ${p?p.name:'this person'}’s access? Their leads stay in the CRM; reassign them from each lead’s page.`)) break;
      const {error}=await Live.sb.from('profiles').update({active:v}).eq('id',t.dataset.id);
      if(error) toast(/admin/i.test(error.message)?error.message:'Couldn’t update access.'); else toast(v?'Approved':'Access removed');
      Live.loadTeam(); break; }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden) closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act=open],b[data-act=open]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input',e=>{ if(e.target.dataset.act==='q'){ S.q=e.target.value; render(); } });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='filt'){ S[t.dataset.f]=t.value; render(); }
  if(t.dataset.act==='team-role'){ (async()=>{ const {error}=await Live.sb.from('profiles').update({role:t.value}).eq('id',t.dataset.id);
    if(error) toast(/admin/i.test(error.message)?error.message:'Couldn’t change the role.'); else toast('Role updated'); Live.loadTeam(); })(); }
  if(t.dataset.act==='demo-me'){ const m=DEMO_TEAM.find(x=>x.id===t.value); S.me={id:m.id,role:m.role,canWrite:true}; Demo.setMe(m.id); if(S.view==='team'&&m.role!=='admin') S.view='dashboard'; if(m.role!=='admin') S.fAgent=''; render(); toast(`Viewing as ${m.name}`); }
});
document.addEventListener('submit',async e=>{
  const f=e.target; if(f.dataset.act==='auth-form'){ e.preventDefault(); authSubmit(f); return; }
  if(f.dataset.act!=='note-form') return; e.preventDefault();
  const l=get(f.dataset.key); const n=String(new FormData(f).get('note')||'').trim(); if(!l||!n) return;
  const c=clone(l); addAct(c,'note',n); f.reset(); await persist(c); toast('Note added');
});
async function addSamples(){
  const mk=(o)=>({id:uid(),createdAt:nowISO(),stage:'New',activities:[],visits:[],createdBy:S.me.id,assignedTo:S.me.id,whatsapp:o.phone,priority:'Warm',source:'Phone Call',...o});
  const a=mk({name:'Sample — Rohan Deshmukh',phone:'+919000010001',type:'buy',propertyType:'Flat',bhk:'2 BHK',localities:['Ausa Road'],budgetMax:4500000,finance:'Home loan',notes:'Fictional sample lead'});
  const b=mk({name:'Sample — Sneha Kulkarni',phone:'+919000010002',type:'rent',propertyType:'Flat',bhk:'2 BHK',localities:['Barshi Road'],rentMax:15000,notes:'Fictional sample lead'});
  for(const l of [a,b]){ addAct(l,'created','Sample lead added'); await persist(l); }
  toast('2 sample leads added');
}

/* ---------- Boot ---------- */
(function boot(){
  const c=window.PPL_CONFIG||{};
  const configured=c.supabaseUrl&&c.supabaseAnonKey&&!/YOUR[-_]/i.test(c.supabaseUrl+c.supabaseAnonKey);
  if(configured&&window.supabase&&window.supabase.createClient){ Live.start(); }
  else { S.mode='setup'; if(configured) S.setupMsg='The Supabase library didn’t load. Check your internet connection and reload the page.'; }
  render();
  setInterval(()=>{ if(!$('#modal').hidden||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) return;
    if(S.mode==='live') Live.loadLeads(); else render(); },60000);
})();
</script>
</body>
</html>
