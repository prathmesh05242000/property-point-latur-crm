<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expenses · Property Point Latur CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3F7F6;--surface:#FFFFFF;--surface-2:#F5FAF8;--ink:#12302A;--muted:#566F68;--line:#D5E4DF;
  --teal:#0A7F62;--teal-hover:#086B52;--teal-soft:#DCF6EE;--teal-deep:#0F3D35;--mint:#06D9A6;
  --hot:#B5381F;--hot-soft:#FBE7E2;--warm:#9E5E06;--warm-soft:#FAEFDB;--sell:#1D5FA6;--sell-soft:#E2EDF9;
  --rent:#594594;--rent-soft:#ECE7F7;--ro:#A3366F;--ro-soft:#F8E4EE;
  --radius:16px;--shadow:0 1px 2px rgba(10,40,40,.06),0 6px 20px rgba(10,40,40,.07);--scrim:rgba(8,30,30,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Mukta,"Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--teal-deep);color:#fff;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px}
.top a.back{color:#fff;text-decoration:none;display:flex;align-items:center;gap:6px;font-weight:500;opacity:.9}
.top a.back:hover{opacity:1}
.top .brand{font-weight:700;margin-left:auto;font-size:15px;opacity:.85}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 110px}
h1{font-size:28px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head .grow{flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-hover)}
.btn.danger{color:var(--hot);border-color:#EFC7BD}
.btn.sm{padding:5px 12px;min-height:34px;font-size:14px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #0A9C78;outline-offset:2px}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 18px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(10,40,40,.04)}
.tab:hover{border-color:#B9D3CB}
.tab .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;line-height:1.2}
.tab .amt{font-size:21px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.tab .ct{font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
@media (max-width:860px){.tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-left:-18px;margin-right:-18px;padding:0 18px 4px}.tab{flex:0 0 170px;scroll-snap-align:start}}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select,.bar input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px}
.bar .info{color:var(--muted);font-size:14px;margin-left:auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sum{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.sum .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.sum .chip b{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{font-weight:700}
.cat{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:1px 10px;background:var(--teal-soft);color:var(--teal-deep)}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:2px}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-weight:700;background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
@media (max-width:700px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  td{padding:0;border:0}
  td.d{grid-column:1;font-size:14px;color:var(--muted)}
  td.num{grid-column:2;grid-row:1 / span 2;font-size:18px;align-self:center}
  td.c{grid-column:1}
  td.m{display:none}
  td.a{grid-column:1 / -1;margin-top:6px}
  .rowact{justify-content:flex-start}
}

.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 20px rgba(10,60,50,.3);border-radius:999px;padding:12px 20px}
@media (min-width:861px){.fab{display:none}}

.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{padding:18px 20px 6px;display:flex;align-items:center}
.modal header h2{margin:0;font-size:20px;flex:1}
.modal .x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal form{padding:8px 20px 20px;display:grid;gap:12px}
.f label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.err{color:var(--hot);font-size:14px;min-height:1em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--teal-deep);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="./">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back to CRM
  </a>
  <span class="brand">Property Point Latur</span>
</div>

<main class="wrap" id="app"><div class="loading">Loading expenses…</div></main>

<button class="btn primary fab" id="fab" hidden>+ Add expense</button>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <header><h2 id="mTitle">Add expense</h2><button class="x" type="button" data-close aria-label="Close">×</button></header>
    <form id="form" novalidate>
      <div class="f"><label for="fAcc">Expense of</label><select id="fAcc" required></select></div>
      <div class="two">
        <div class="f"><label for="fAmt">Amount (₹)</label><input id="fAmt" inputmode="decimal" placeholder="e.g. 1500" required></div>
        <div class="f"><label for="fDate">Date</label><input id="fDate" type="date" required></div>
      </div>
      <div class="two">
        <div class="f"><label for="fCat">Category</label><select id="fCat"></select></div>
        <div class="f"><label for="fMode">Paid via</label><select id="fMode"></select></div>
      </div>
      <div class="f"><label for="fNote">Note</label><textarea id="fNote" placeholder="What was it for? e.g. Petrol for Ausa Road site visit"></textarea></div>
      <div class="err" id="fErr"></div>
      <div class="actions">
        <button type="button" class="btn danger" id="fDel" hidden>Delete</button>
        <span style="flex:1"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="fSave">Save</button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const ACCOUNTS = [
    {key:'Mahadev Badgire',  short:'MB', bg:'#DCF6EE', fg:'#0A7F62'},
    {key:'Vinod Mane',       short:'VM', bg:'#E2EDF9', fg:'#1D5FA6'},
    {key:'Prathmesh Mane',   short:'PM', bg:'#ECE7F7', fg:'#594594'},
    {key:'Pandurang Bhange', short:'PB', bg:'#FAEFDB', fg:'#9E5E06'},
    {key:'Company',          short:'CO', bg:'#0F3D35', fg:'#FFFFFF', label:'Company Expense'}
  ];
  const CATS = ['Fuel / Travel','Site visit','Marketing / Ads','Office rent','Electricity / Internet','Phone / Recharge','Salary / Commission','Tea / Food','Printing / Stationery','Legal / Documentation','Other'];
  const MODES = ['Cash','UPI','Bank transfer','Card','Cheque'];

  const cfg = window.PPL_CONFIG || {};
  const app = document.getElementById('app');
  if(!cfg.supabaseUrl || !window.supabase){ app.innerHTML = '<div class="empty">Supabase settings not found. Check config.js.</div>'; return; }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  let rows = [];
  let active = localStorage.getItem('ppl_exp_tab') || ACCOUNTS[0].key;
  if(!ACCOUNTS.some(a=>a.key===active)) active = ACCOUNTS[0].key;
  let fMonth = thisMonth(), fCat = '';
  let editing = null;

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const inr = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
  function thisMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
  function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }
  const acc = k => ACCOUNTS.find(a=>a.key===k) || ACCOUNTS[4];
  const accLabel = a => a.label || a.key;
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

  function inPeriod(r){ return fMonth==='all' || r.spent_on.slice(0,7)===fMonth; }

  function render(){
    const period = rows.filter(inPeriod);
    const months = [...new Set(rows.map(r=>r.spent_on.slice(0,7)).concat([thisMonth()]))].sort().reverse();
    const grand = period.reduce((s,r)=>s+Number(r.amount),0);
    const a = acc(active);
    const list = period.filter(r=>r.account===active && (!fCat || r.category===fCat));
    const total = list.reduce((s,r)=>s+Number(r.amount),0);
    const byCat = {};
    list.forEach(r=>{ byCat[r.category]=(byCat[r.category]||0)+Number(r.amount); });

    app.innerHTML = `
      <div class="head">
        <div class="grow"><h1>Expenses</h1><p class="sub">Partner and company spending · ${esc(fMonth==='all'?'All time':monthLabel(fMonth))} total <b>${inr(grand)}</b></p></div>
        <button class="btn" id="csv">Export CSV</button>
        <button class="btn primary" id="add">+ Add expense</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Expense accounts">
        ${ACCOUNTS.map(x=>{
          const rs = period.filter(r=>r.account===x.key);
          const t = rs.reduce((s,r)=>s+Number(r.amount),0);
          return `<button class="tab" role="tab" aria-selected="${x.key===active}" data-tab="${esc(x.key)}">
            <span class="nm"><span class="av" style="background:${x.bg};color:${x.fg}">${x.short}</span>${esc(accLabel(x))}</span>
            <div class="amt">${inr(t)}</div><div class="ct">${rs.length} ${rs.length===1?'entry':'entries'}</div></button>`;
        }).join('')}
      </div>
      <div class="bar">
        <select id="month" aria-label="Month">
          <option value="all"${fMonth==='all'?' selected':''}>All time</option>
          ${months.map(m=>`<option value="${m}"${m===fMonth?' selected':''}>${monthLabel(m)}</option>`).join('')}
        </select>
        <select id="cat" aria-label="Category">
          <option value="">All categories</option>
          ${CATS.map(c=>`<option${c===fCat?' selected':''}>${esc(c)}</option>`).join('')}
        </select>
        <span class="info">${list.length} ${list.length===1?'expense':'expenses'} · ${esc(accLabel(a))}</span>
      </div>
      <div class="card">
        ${Object.keys(byCat).length ? `<div class="sum">${Object.entries(byCat).sort((x,y)=>y[1]-x[1]).map(([c,v])=>`<span class="chip">${esc(c)} <b>${inr(v)}</b></span>`).join('')}</div>` : ''}
        ${list.length ? `
        <table>
          <thead><tr><th>Date</th><th>Category / Note</th><th>Paid via</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody>${list.map(r=>`
            <tr>
              <td class="d">${fmtDate(r.spent_on)}</td>
              <td class="c"><span class="cat">${esc(r.category)}</span>${r.note?`<div class="note">${esc(r.note)}</div>`:''}</td>
              <td class="m muted">${esc(r.payment_mode||'—')}</td>
              <td class="num">${inr(r.amount)}</td>
              <td class="a"><div class="rowact"><button class="btn sm" data-edit="${r.id}">Edit</button></div></td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div class="foot"><span>Total · ${esc(accLabel(a))}</span><span>${inr(total)}</span></div>`
        : `<div class="empty">No expenses for ${esc(accLabel(a))} ${fMonth==='all'?'yet':'in '+esc(monthLabel(fMonth))}.<br><br><button class="btn primary" id="add2">+ Add expense</button></div>`}
      </div>`;
    document.getElementById('fab').hidden = false;
  }

  app.addEventListener('click', e=>{
    const t = e.target.closest('[data-tab]');
    if(t){ active=t.dataset.tab; localStorage.setItem('ppl_exp_tab',active); render(); return; }
    const ed = e.target.closest('[data-edit]');
    if(ed){ openForm(rows.find(r=>String(r.id)===ed.dataset.edit)); return; }
    if(e.target.closest('#add,#add2')) openForm(null);
    if(e.target.closest('#csv')) exportCsv();
  });
  app.addEventListener('change', e=>{
    if(e.target.id==='month'){ fMonth=e.target.value; render(); }
    if(e.target.id==='cat'){ fCat=e.target.value; render(); }
  });
  document.getElementById('fab').onclick = ()=>openForm(null);

  // ----- form -----
  const scrim=document.getElementById('scrim'), form=document.getElementById('form');
  const $=id=>document.getElementById(id);
  $('fAcc').innerHTML = ACCOUNTS.map(a=>`<option value="${esc(a.key)}">${esc(accLabel(a))}</option>`).join('');
  $('fCat').innerHTML = CATS.map(c=>`<option>${esc(c)}</option>`).join('');
  $('fMode').innerHTML = MODES.map(m=>`<option>${esc(m)}</option>`).join('');

  function openForm(r){
    editing = r || null;
    $('mTitle').textContent = r ? 'Edit expense' : 'Add expense';
    $('fAcc').value = r ? r.account : active;
    $('fAmt').value = r ? r.amount : '';
    $('fDate').value = r ? r.spent_on : today();
    $('fCat').value = r ? r.category : CATS[0];
    $('fMode').value = r ? (r.payment_mode||'Cash') : 'UPI';
    $('fNote').value = r ? (r.note||'') : '';
    $('fDel').hidden = !r; $('fErr').textContent='';
    scrim.classList.add('open');
    setTimeout(()=>$('fAmt').focus(),50);
  }
  function closeForm(){ scrim.classList.remove('open'); editing=null; }
  scrim.addEventListener('click', e=>{ if(e.target===scrim || e.target.closest('[data-close]')) closeForm(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && scrim.classList.contains('open')) closeForm(); });

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const amt = Number(String($('fAmt').value).replace(/[₹,\s]/g,''));
    if(!(amt>0)){ $('fErr').textContent='Enter an amount greater than 0.'; return; }
    if(!$('fDate').value){ $('fErr').textContent='Pick a date.'; return; }
    const rec = { account:$('fAcc').value, amount:amt, spent_on:$('fDate').value, category:$('fCat').value, payment_mode:$('fMode').value, note:$('fNote').value.trim()||null };
    $('fSave').disabled=true;
    const q = editing ? sb.from('expenses').update(rec).eq('id',editing.id).select().single()
                      : sb.from('expenses').insert(rec).select().single();
    const {data,error} = await q;
    $('fSave').disabled=false;
    if(error){ $('fErr').textContent='Could not save: '+error.message; return; }
    if(editing) rows = rows.map(x=>x.id===data.id?data:x); else rows.unshift(data);
    sortRows();
    active = rec.account; localStorage.setItem('ppl_exp_tab',active);
    if(fMonth!=='all' && rec.spent_on.slice(0,7)!==fMonth) fMonth = rec.spent_on.slice(0,7);
    toast(editing?'Expense updated':'Expense added');
    closeForm(); render();
  });
  $('fDel').onclick = async ()=>{
    if(!editing) return;
    const b=$('fDel');
    if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to delete'; setTimeout(()=>{b.dataset.confirm='';b.textContent='Delete';},3000); return; }
    const {error} = await sb.from('expenses').delete().eq('id',editing.id);
    b.dataset.confirm=''; b.textContent='Delete';
    if(error){ $('fErr').textContent='Could not delete: '+error.message; return; }
    rows = rows.filter(x=>x.id!==editing.id);
    toast('Expense deleted'); closeForm(); render();
  };

  function sortRows(){ rows.sort((a,b)=> b.spent_on.localeCompare(a.spent_on) || String(b.created_at).localeCompare(String(a.created_at))); }

  function exportCsv(){
    const list = rows.filter(inPeriod);
    const head = ['Date','Expense of','Category','Paid via','Amount','Note'];
    const cell = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const csv = [head.map(cell).join(',')].concat(list.map(r=>[r.spent_on,accLabel(acc(r.account)),r.category,r.payment_mode,r.amount,r.note].map(cell).join(','))).join('\n');
    const blob = new Blob(['﻿'+csv],{type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'expenses-'+(fMonth==='all'?'all':fMonth)+'.csv';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }

  async function load(){
    const {data:{session}} = await sb.auth.getSession();
    if(!session){ app.innerHTML='<div class="empty">Please sign in to the CRM first.<br><br><a class="btn primary" href="./">Go to sign in</a></div>'; return; }
    const {data,error} = await sb.from('expenses').select('*').order('spent_on',{ascending:false}).limit(5000);
    if(error){
      app.innerHTML = `<div class="empty">Could not load expenses: ${esc(error.message)}<br><span class="muted">If this says the table doesn't exist, run the expenses SQL in Supabase once.</span></div>`;
      return;
    }
    rows = data||[]; sortRows(); render();
  }
  load();
})();
</script>
</body>
</html>
